name: research-validation

on:
  workflow_dispatch:
    inputs:
      validation_start:
        type: string
        default: "2021-01-01"
      validation_end:
        type: string
        default: "2026-08-01"

concurrency:
  group: research-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-jobs.txt
            requirements-bot.txt
      - run: pip install -r requirements-jobs.txt
      - name: Rebuild twice and validate holdout
        run: |
          python -m operations.research_cli rebuild-monthly-panel \
            --start "${{ inputs.validation_start }}" --end "${{ inputs.validation_end }}" \
            --scores-output /tmp/scores-a.csv --bars-output /tmp/bars-a.csv
          python -m operations.research_cli rebuild-monthly-panel \
            --start "${{ inputs.validation_start }}" --end "${{ inputs.validation_end }}" \
            --scores-output /tmp/scores-b.csv --bars-output /tmp/bars-b.csv
          cmp /tmp/scores-a.csv /tmp/scores-b.csv
          cmp /tmp/bars-a.csv /tmp/bars-b.csv
          python -m operations.research_cli validate-quant \
            --scores /tmp/scores-a.csv --bars /tmp/bars-a.csv \
            --output /tmp/validation.json --persist \
            --model-version lq45-factor-v1-shadow --deterministic-rebuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: research-validation-${{ github.run_id }}
          path: |
            /tmp/validation.json
            /tmp/scores-a.csv
          retention-days: 30
