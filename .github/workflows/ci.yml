name: pull-request-gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit:
    name: unit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-bot.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - run: python -m operations.research_cli check-research-release --base-ref "${{ github.event.pull_request.base.sha }}"
      - run: python -m unittest discover -s tests -v
      - run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  quality:
    name: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-ci.txt
      - run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed="$(git diff --name-only "$base...HEAD" -- '*.py')"
          if [[ -z "$changed" ]]; then echo 'No changed Python files.'; exit 0; fi
          ruff format --check $changed
          ruff check $changed
          mypy --follow-imports=skip --ignore-missing-imports --disable-error-code=import-untyped $changed

  workflow-policy:
    name: workflow-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install -r requirements-ci.txt
      - run: |
          python scripts/ci/check_workflow_policy.py --base-ref "${{ github.event.pull_request.base.sha }}" --required-jobs

  migration:
    name: migration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:56f243d2355bad7d2016b1e78b80da8ac9e7967b766be2bfbff84fe85ffa30bc # PostgreSQL 16 amd64
        env:
          POSTGRES_USER: pasticuan_ci
          POSTGRES_PASSWORD: pasticuan_ci
          POSTGRES_DB: pasticuan_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pasticuan_ci -d pasticuan_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install -r requirements-bot.txt -r requirements-ci.txt
      - run: python scripts/ci/check_migrations.py --database-url postgresql://pasticuan_ci:pasticuan_ci@localhost:5432/pasticuan_ci --base-ref "${{ github.event.pull_request.base.sha }}"

  container-smoke:
    name: container-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build --pull=false --tag pasticuan-ci:${{ github.sha }} .
      - name: Start webhook and probe health
        run: PORT=18080 scripts/ci/container_smoke.sh "pasticuan-ci:${{ github.sha }}"

  manifest-validate:
    name: manifest-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Validate changed official manifest
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- data/idx_filing_manifest.json data/source_manifest.json)"
          if [[ -z "$changed" ]]; then
            echo "manifest-validate: not applicable (no manifest paths changed)"
            exit 0
          fi
          if [[ "$changed" == *data/idx_filing_manifest.json* ]]; then
            git show "${{ github.event.pull_request.base.sha }}:data/idx_filing_manifest.json" > /tmp/base-idx-filing-manifest.json
            python scripts/ci/validate_manifest.py data/idx_filing_manifest.json --kind filing --baseline /tmp/base-idx-filing-manifest.json
          fi
          if [[ "$changed" == *data/source_manifest.json* ]]; then
            git show "${{ github.event.pull_request.base.sha }}:data/source_manifest.json" > /tmp/base-source-manifest.json
            python scripts/ci/validate_manifest.py data/source_manifest.json --kind source --baseline /tmp/base-source-manifest.json
          fi

  security:
    name: security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install -r requirements-ci.txt
      - name: Scan tracked source for credential material
        run: |
          python scripts/ci/check_security.py
      - run: python -m pip check
      - run: pip-audit --requirement requirements.txt --requirement requirements-bot.txt --requirement requirements-jobs.txt --requirement requirements-ci.txt --strict --progress-spinner off

  verify-main:
    name: verify-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r requirements-bot.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - run: python -m operations.research_cli check-research-release --base-ref "${{ github.event.before }}"
      - run: python -m unittest discover -s tests -v
