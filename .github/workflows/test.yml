name: core-tests

on:
  pull_request:

concurrency:
  group: legacy-test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-bot.txt -r requirements-ci.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - name: Check reviewed calculation release
        run: python -m operations.research_cli check-research-release --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: python -m unittest discover -s tests -v
