name: core-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-bot.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - name: Check reviewed calculation release
        run: python -m operations.research_cli check-research-release --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: python -m unittest discover -s tests -v
