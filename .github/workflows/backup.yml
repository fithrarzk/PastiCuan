name: supabase-backup

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: supabase-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-jobs.txt
            requirements-bot.txt
      - run: pip install -r requirements-jobs.txt
      - name: Check optional backup configuration
        id: configured
        run: |
          if [[ -n "$SUPABASE_WRITER_DATABASE_URL" && -n "$R2_BUCKET" && -n "$BACKUP_ENCRYPTION_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Backup skipped because the optional Supabase/R2 encryption configuration is incomplete." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export, encrypt and upload
        if: steps.configured.outputs.enabled == 'true'
        run: python -m operations.research_cli backup --output "/tmp/pasticuan-$(date -u +%Y-%m-%d).dump" --r2
