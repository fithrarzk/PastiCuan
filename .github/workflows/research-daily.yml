name: research-daily

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/validate-branch.yml"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "DEPLOY_FREE.md"
      - "README.md"
      - "docs/**"
      - "requirements-ci.txt"
      - "scripts/ci/**"
      - "tests/**"
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      final_attempt:
        description: Fail if current-session evidence is still unavailable
        type: boolean
        default: true

concurrency:
  group: research-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      SNAPSHOT_ED25519_PRIVATE_KEY: ${{ secrets.SNAPSHOT_ED25519_PRIVATE_KEY }}
      SNAPSHOT_SIGNING_KEY_ID: ${{ vars.SNAPSHOT_SIGNING_KEY_ID || 'primary' }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-jobs.txt
            requirements-bot.txt
      - run: pip install -r requirements-jobs.txt
      - name: Refresh and publish verified research
        shell: bash
        run: |
          set +e
          flags=()
          if [[ -n "$R2_BUCKET" ]]; then flags+=(--r2); fi
          if [[ "${{ github.event.schedule }}" == "0 14 * * 1-5" || "${{ inputs.final_attempt }}" == "true" ]]; then
            flags+=(--final-attempt)
          fi
          python -m operations.research_cli run-daily-research \
            --output /tmp/daily-research-report.json "${flags[@]}"
          exit_code=$?
          set -e
          case "$exit_code" in
            10)
              echo "Research attempt is waiting for the completed session; scheduled attempt is recorded."
              exit 0
              ;;
            *)
              exit "$exit_code"
              ;;
          esac
      - name: Add run summary
        if: always()
        run: |
          if [[ -f /tmp/daily-research-report.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python -m json.tool /tmp/daily-research-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: daily-research-${{ github.run_id }}
          path: /tmp/daily-research-report.json
          if-no-files-found: warn
          retention-days: 14
