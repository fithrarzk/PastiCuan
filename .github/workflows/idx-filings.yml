name: idx-filings

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [discover, import]
        default: discover
      annual_start_year:
        description: Optional first annual reporting year for reviewed backfill
        type: string
        default: ""
      annual_end_year:
        description: Optional last annual reporting year for reviewed backfill
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - data/idx_filing_manifest.json
      - data/source_manifest.json

concurrency:
  group: idx-filings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'discover')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-jobs.txt
            requirements-bot.txt
      - run: pip install -r requirements-jobs.txt
      - name: Import reviewed source manifest
        run: |
          flags=()
          if [[ -n "$R2_BUCKET" ]]; then flags+=(--r2); fi
          python -m operations.research_cli ingest-manifest \
            --manifest data/source_manifest.json --report /tmp/source-ingestion-report.json "${flags[@]}"
      - name: Discover official attachments
        run: |
          history_flags=()
          if [[ -n "${{ inputs.annual_start_year }}" ]]; then
            history_flags+=(--annual-start-year "${{ inputs.annual_start_year }}")
          fi
          if [[ -n "${{ inputs.annual_end_year }}" ]]; then
            history_flags+=(--annual-end-year "${{ inputs.annual_end_year }}")
          fi
          python -m operations.research_cli discover-idx-xbrl \
            --output /tmp/idx_filing_manifest.json \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" --period auto \
            "${history_flags[@]}"
      - name: Open manifest review PR when changed
        run: |
          branch="idx-manifest-review"
          git config user.name "pasticuan-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git checkout -b "$branch" origin/main
          fi
          python -m data.filing_manifest \
            --baseline data/idx_filing_manifest.json \
            --discovered /tmp/idx_filing_manifest.json \
            --output data/idx_filing_manifest.json
          if git diff --quiet -- data/idx_filing_manifest.json; then
            echo "Official manifest is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add data/idx_filing_manifest.json
          git commit -m "Update reviewed IDX filing manifest"
          git push origin "$branch"
          head_sha="$(git rev-parse HEAD)"
          pr_number="$(gh pr list --state open --base main --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create --title "Review official IDX filing manifest" \
              --body "Review every ticker, publication timestamp, reporting period, and official IDX URL. Merging automatically imports accepted filings and refreshes research." \
              --base main --head "$branch"
          fi
          gh workflow run validate-branch.yml --ref "$branch" \
            -f branch="$branch" -f sha="$head_sha"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: idx-manifest-draft-${{ github.run_id }}
          path: /tmp/idx_filing_manifest.json
          retention-days: 30

  import:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'import')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-jobs.txt
            requirements-bot.txt
      - run: pip install -r requirements-jobs.txt
      - name: Import reviewed official XBRL
        run: |
          flags=()
          if [[ -n "$R2_BUCKET" ]]; then flags+=(--r2); fi
          python -m operations.research_cli ingest-manifest \
            --manifest data/source_manifest.json --report /tmp/source-ingestion-report.json "${flags[@]}"
          python -m operations.research_cli ingest-idx-xbrl \
            --manifest data/idx_filing_manifest.json \
            --report /tmp/idx-xbrl-ingestion-report.json "${flags[@]}"
      - name: Request a research refresh
        run: gh workflow run research-daily.yml --ref main -f final_attempt=false
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: idx-xbrl-review-${{ github.run_id }}
          path: /tmp/idx-xbrl-ingestion-report.json
          retention-days: 30
