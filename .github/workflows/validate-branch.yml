name: validate-branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Generated branch to validate
        required: true
        type: string
      sha:
        description: Expected generated branch head SHA
        required: true
        type: string

concurrency:
  group: validate-branch-${{ inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VALIDATION_BRANCH: ${{ inputs.branch }}
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Verify exact branch head
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$VALIDATION_BRANCH" | awk '{print $1}')"
          [[ -n "$remote_sha" ]]
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$remote_sha" == "$EXPECTED_SHA" ]]
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-bot.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - name: Check reviewed calculation release
        run: python -m operations.research_cli check-research-release --base-ref origin/main
      - run: python -m unittest discover -s tests -v
