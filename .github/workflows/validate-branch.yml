name: validate-branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Generated branch to validate
        required: true
        type: string
      sha:
        description: Expected generated branch head SHA
        required: true
        type: string

concurrency:
  group: validate-branch-${{ inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VALIDATION_BRANCH: ${{ inputs.branch }}
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Verify exact branch head
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$VALIDATION_BRANCH" | awk '{print $1}')"
          [[ -n "$remote_sha" ]]
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$remote_sha" == "$EXPECTED_SHA" ]]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-bot.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - name: Check reviewed calculation release
        run: python -m operations.research_cli check-research-release --base-ref origin/main
      - run: python -m unittest discover -s tests -v

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-bot.txt
      - run: python -m compileall -q analysis data storage operations telegram_utils bot.py bot_webhook.py
      - run: python -m operations.research_cli check-research-release --base-ref origin/main
      - run: python -m unittest discover -s tests -v

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r requirements-ci.txt
      - run: ruff check scripts/ci tests/test_ci_gates.py tests/test_workflow_policy.py
      - run: mypy --follow-imports=skip --ignore-missing-imports --disable-error-code=import-untyped scripts/ci

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r requirements-ci.txt
      - run: python scripts/ci/check_workflow_policy.py .github/workflows/ci.yml --required-jobs

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: pasticuan_ci, POSTGRES_PASSWORD: pasticuan_ci, POSTGRES_DB: pasticuan_ci}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pasticuan_ci -d pasticuan_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r requirements-bot.txt -r requirements-ci.txt
      - run: python scripts/ci/check_migrations.py --database-url postgresql://pasticuan_ci:pasticuan_ci@localhost:5432/pasticuan_ci

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
      - run: docker build --pull=false --tag pasticuan-validation:${{ inputs.sha }} .
      - run: |
          docker run --detach --rm --name pasticuan-validation --publish 18080:8080 \
            --env TELEGRAM_BOT_TOKEN=000000000:ci-smoke-token --env TELEGRAM_WEBHOOK_SECRET=ci-smoke-secret \
            --env PORT=8080 pasticuan-validation:${{ inputs.sha }} uvicorn bot_webhook:api --host 0.0.0.0 --port 8080 --lifespan off
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:18080/ && curl --fail --silent http://127.0.0.1:18080/ready && exit 0; sleep 1; done
          docker logs pasticuan-validation
          exit 1
      - if: always()
        run: docker rm --force pasticuan-validation || true

  manifest-validate:
    name: manifest-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - run: python scripts/ci/validate_manifest.py data/idx_filing_manifest.json

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r requirements-ci.txt
      - run: '! git grep -nE ''(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})'' -- '':!docs'''
      - run: python -m pip check
      - run: pip-audit --requirement requirements-ci.txt --no-deps --strict --progress-spinner off
