name: research-core

on:
  workflow_dispatch:
    inputs:
      build_snapshot:
        description: Build a candidate snapshot when factor inputs exist
        type: boolean
        default: false
      run_backup:
        description: Export and encrypt Supabase to R2
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-jobs.txt
      - name: Acquire source artifacts
        run: |
          r2_flag=""
          if [ -n "$R2_BUCKET" ]; then r2_flag="--r2"; fi
          python -m operations.research_cli ingest-manifest \
            --manifest data/source_manifest.json --report /tmp/ingestion-report.json $r2_flag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-review-${{ github.run_id }}
          path: /tmp/ingestion-report.json
          retention-days: 14
      - name: Build candidate
        if: ${{ inputs.build_snapshot }}
        run: |
          effective_at="$(date -u +%Y-%m-%dT00:00:00+00:00)"
          if [ -n "$SUPABASE_WRITER_DATABASE_URL" ]; then
            python -m operations.research_cli build-snapshot-from-database \
              --output data/snapshots/candidate.json.gz --effective-at "$effective_at"
          elif [ -f data/research/factor_inputs.csv ]; then
            python -m operations.research_cli build-snapshot \
              --input data/research/factor_inputs.csv \
              --output data/snapshots/candidate.json.gz --effective-at "$effective_at"
          else
            echo "No Supabase writer URL or reviewed factor input file is available." >&2
            exit 1
          fi
      - name: Open review pull request
        if: ${{ inputs.build_snapshot && hashFiles('data/snapshots/candidate.json.gz') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="research-snapshot-${GITHUB_RUN_ID}"
          git config user.name "pasticuan-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/snapshots/candidate.json.gz
          git commit -m "Add candidate research snapshot"
          git push origin "$branch"
          gh pr create --title "Review candidate research snapshot" \
            --body "Candidate only. Review ingestion report and validation evidence before approval." \
            --base "$GITHUB_REF_NAME" --head "$branch"

  backup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backup }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-jobs.txt
      - run: python -m operations.research_cli backup --output "/tmp/pasticuan-$(date -u +%Y-%m-%d).dump" --r2
