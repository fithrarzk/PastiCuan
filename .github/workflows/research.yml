name: research-core

on:
  workflow_dispatch:
    inputs:
      build_snapshot:
        description: Build a candidate snapshot when factor inputs exist
        type: boolean
        default: false
      ingest_idx_filings:
        description: Download and import official IDX XBRL URLs from the reviewed manifest
        type: boolean
        default: false
      discover_idx_filings:
        description: Create a review PR containing official IDX XBRL attachment URLs
        type: boolean
        default: false
      idx_report_year:
        description: Reporting year used by IDX discovery
        type: string
        default: "2026"
      idx_report_period:
        description: Latest cumulative interim period used by IDX discovery
        type: choice
        options: [tw1, tw2, tw3]
        default: tw2
      publish_reviewed_shadow:
        description: Publish the reviewed candidate already merged to the default branch
        type: boolean
        default: false
      run_backup:
        description: Export and encrypt Supabase to R2
        type: boolean
        default: false
      build_scan:
        description: Build and publish the full-LQ45 EOD scan
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * 1"
    - cron: "30 10 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-jobs.txt
      - name: Acquire source artifacts
        if: ${{ github.event_name != 'schedule' || github.event.schedule != '30 10 * * 1-5' }}
        run: |
          r2_flag=""
          if [ -n "$R2_BUCKET" ]; then r2_flag="--r2"; fi
          python -m operations.research_cli ingest-manifest \
            --manifest data/source_manifest.json --report /tmp/ingestion-report.json $r2_flag
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name != 'schedule' || github.event.schedule != '30 10 * * 1-5') }}
        with:
          name: ingestion-review-${{ github.run_id }}
          path: /tmp/ingestion-report.json
          retention-days: 14
      - name: Acquire official IDX XBRL filings
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 2 * * 1') || inputs.ingest_idx_filings }}
        run: |
          r2_flag=""
          if [ -n "$R2_BUCKET" ]; then r2_flag="--r2"; fi
          python -m operations.research_cli ingest-idx-xbrl \
            --manifest data/idx_filing_manifest.json \
            --report /tmp/idx-xbrl-ingestion-report.json $r2_flag
      - uses: actions/upload-artifact@v4
        if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '17 2 * * 1') || inputs.ingest_idx_filings) }}
        with:
          name: idx-xbrl-review-${{ github.run_id }}
          path: /tmp/idx-xbrl-ingestion-report.json
          retention-days: 30
      - name: Discover official IDX XBRL attachment URLs
        if: ${{ inputs.discover_idx_filings }}
        run: |
          as_of="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          python -m operations.research_cli discover-idx-xbrl \
            --output /tmp/idx_filing_manifest.json --as-of "$as_of" \
            --year "${{ inputs.idx_report_year }}" --period "${{ inputs.idx_report_period }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.discover_idx_filings }}
        with:
          name: idx-manifest-draft-${{ github.run_id }}
          path: /tmp/idx_filing_manifest.json
          retention-days: 30
      - name: Open IDX manifest review pull request
        if: ${{ inputs.discover_idx_filings }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/idx_filing_manifest.json data/idx_filing_manifest.json
          branch="idx-manifest-${GITHUB_RUN_ID}"
          git config user.name "pasticuan-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/idx_filing_manifest.json
          git commit -m "Update reviewed IDX filing manifest"
          git push origin "$branch"
          gh pr create --title "Review official IDX filing manifest" \
            --body "Review every ticker, publication timestamp, period, and official IDX URL before merge. This PR imports no data." \
            --base "$GITHUB_REF_NAME" --head "$branch"
      - name: Build and publish full-LQ45 EOD scan
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 10 * * 1-5') || inputs.build_scan }}
        run: |
          r2_flag=""
          if [ -n "$R2_BUCKET" ]; then r2_flag="--r2"; fi
          python -m operations.research_cli build-daily-scan \
            --output /tmp/scan-report.json $r2_flag
      - uses: actions/upload-artifact@v4
        if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '30 10 * * 1-5') || inputs.build_scan) }}
        with:
          name: lq45-scan-${{ github.run_id }}
          path: /tmp/scan-report.json
          retention-days: 14
      - name: Build candidate
        if: ${{ inputs.build_snapshot }}
        run: |
          effective_at="$(date -u +%Y-%m-%dT00:00:00+00:00)"
          if [ -n "$SUPABASE_WRITER_DATABASE_URL" ]; then
            python -m operations.research_cli build-snapshot-from-database \
              --output data/snapshots/candidate.json.gz --effective-at "$effective_at"
          elif [ -f data/research/factor_inputs.csv ]; then
            python -m operations.research_cli build-snapshot \
              --input data/research/factor_inputs.csv \
              --output data/snapshots/candidate.json.gz --effective-at "$effective_at"
          else
            echo "No Supabase writer URL or reviewed factor input file is available." >&2
            exit 1
          fi
      - name: Open review pull request
        if: ${{ inputs.build_snapshot && hashFiles('data/snapshots/candidate.json.gz') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="research-snapshot-${GITHUB_RUN_ID}"
          git config user.name "pasticuan-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/snapshots/candidate.json.gz
          git commit -m "Add candidate research snapshot"
          git push origin "$branch"
          gh pr create --title "Review candidate research snapshot" \
            --body "Candidate only. Review ingestion report and validation evidence before approval." \
            --base "$GITHUB_REF_NAME" --head "$branch"
      - name: Publish reviewed SHADOW quant snapshot
        if: ${{ inputs.publish_reviewed_shadow }}
        run: |
          python -m operations.research_cli publish-reviewed-shadow \
            --candidate data/snapshots/candidate.json.gz \
            --output /tmp/approved-shadow.json.gz
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.publish_reviewed_shadow }}
        with:
          name: approved-shadow-${{ github.run_id }}
          path: /tmp/approved-shadow.json.gz
          retention-days: 30

  backup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backup }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_WRITER_DATABASE_URL: ${{ secrets.SUPABASE_WRITER_DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-jobs.txt
      - run: python -m operations.research_cli backup --output "/tmp/pasticuan-$(date -u +%Y-%m-%d).dump" --r2
